name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: npm
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run fetch:bgm
      - run: npm run check:public
      - run: npm run check:docs
      - run: npm run check
        env:
          BENCHMARK_SELF_TEST_ALLOW_MISSING_RUNNER_CLI: "1"
