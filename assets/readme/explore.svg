<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">Explore the visual benchmark collection</title>
  <desc id="desc">Four cards summarize Three.js prompts, Twigl prompts, runnable model profiles, and custom model pairs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b18"/><stop offset="1" stop-color="#11152a"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1600" height="440" rx="32" fill="url(#bg)"/>
  <circle cx="1450" cy="-40" r="210" fill="#7c3aed" opacity=".14" filter="url(#glow)"/>
  <circle cx="130" cy="470" r="190" fill="#0891b2" opacity=".12" filter="url(#glow)"/>
  <text x="64" y="70" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">EXPLORE THE COLLECTION</text>
  <text x="64" y="112" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">Prompts, models, methods, and pairings — all configurable.</text>
  <g transform="translate(64 150)">
    <rect width="342" height="226" rx="22" fill="#11182b" stroke="#334155"/>
    <circle cx="54" cy="54" r="27" fill="url(#violet)"/><path d="M43 58l11-17 11 17-11 8z" fill="#fff" opacity=".92"/>
    <text x="28" y="126" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="800">18</text>
    <text x="28" y="165" fill="#c4b5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">THREE.JS WORLDS</text>
    <text x="28" y="198" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Games · simulations · 3D scenes</text>
  </g>
  <g transform="translate(430 150)">
    <rect width="342" height="226" rx="22" fill="#11182b" stroke="#334155"/>
    <circle cx="54" cy="54" r="27" fill="url(#cyan)"/><path d="M39 58c15-21 27-17 32-4-13-7-24 15-32 4z" fill="#fff" opacity=".92"/>
    <text x="28" y="126" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="800">2</text>
    <text x="28" y="165" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">TWIGL SHADERS</text>
    <text x="28" y="198" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">GLSL · motion · multi-round iteration</text>
  </g>
  <g transform="translate(796 150)">
    <rect width="342" height="226" rx="22" fill="#11182b" stroke="#334155"/>
    <circle cx="54" cy="54" r="27" fill="url(#amber)"/><circle cx="48" cy="51" r="7" fill="#fff"/><circle cx="65" cy="51" r="7" fill="#fff"/><path d="M45 66h23" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="28" y="126" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="800">12</text>
    <text x="28" y="165" fill="#fcd34d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">MODEL PROFILES</text>
    <text x="28" y="198" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Codex CLI · Claude Code</text>
  </g>
  <g transform="translate(1162 150)">
    <rect width="374" height="226" rx="22" fill="#11182b" stroke="#334155"/>
    <circle cx="54" cy="54" r="27" fill="#1e293b" stroke="#64748b"/><path d="M43 54h22M54 43v22" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="28" y="126" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="800">A × B</text>
    <text x="28" y="165" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">YOUR MODEL PAIR</text>
    <text x="28" y="198" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Built-in or bring your own</text>
  </g>
</svg>
